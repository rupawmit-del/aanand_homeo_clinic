<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A8F6A" />
      <stop offset="100%" stop-color="#065F46" />
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background with rounded squircles -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  
  <!-- Subtle circular halo ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#ffffff" stroke-width="6" stroke-opacity="0.2" stroke-dasharray="12 12" />
  
  <!-- Central White Shield Badge -->
  <g filter="url(#dropShadow)">
    <circle cx="256" cy="256" r="150" fill="#ffffff" />
  </g>

  <!-- Medical Cross in Medical Blue -->
  <path d="M 230 156 L 282 156 A 8 8 0 0 1 290 164 L 290 226 L 352 226 A 8 8 0 0 1 360 234 L 360 286 A 8 8 0 0 1 352 294 L 290 294 L 290 356 A 8 8 0 0 1 282 364 L 230 364 A 8 8 0 0 1 222 356 L 222 294 L 160 294 A 8 8 0 0 1 152 286 L 152 234 A 8 8 0 0 1 160 226 L 222 226 L 222 164 A 8 8 0 0 1 230 156 Z" fill="url(#crossGrad)" />

  <!-- Homeopathic Healing Leaf overlay in Emerald -->
  <path d="M 256 210 C 270 170 330 160 340 220 C 340 260 290 290 256 310 C 222 290 172 260 172 220 C 182 160 242 170 256 210 Z" fill="#0A8F6A" opacity="0.95" />
  <path d="M 256 210 Q 256 260 256 310" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" />
  <path d="M 256 240 Q 275 230 290 238" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M 256 265 Q 235 255 220 265" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- Letter A for Aanand -->
  <text x="256" y="415" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="4">AANAND</text>
  <text x="256" y="445" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="18" fill="#A7F3D0" text-anchor="middle" letter-spacing="3">HOMEO CLINIC</text>
</svg>
